<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f1e9" id="theme-color">
<title>Filmcode — Guess the Movie in Color</title>
<meta name="description" content="Can you recognize a movie from its chronological color barcode? One film, four choices.">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("filmcode-theme")==="dark"?"dark":"light"}catch{document.documentElement.dataset.theme="light"}</script>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:#090a10;color:#f6f2eb}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#25202c 0%,#090a10 65%);min-height:100vh}
a{color:inherit}.top{border-bottom:1px solid #ffffff18;padding:22px max(22px,calc((100vw - 920px)/2));font-weight:850;letter-spacing:.06em}
.top span,.accent{color:#efb96f}
main{max-width:920px;margin:48px auto 90px;padding:0 20px}
.overline{font-size:11px;letter-spacing:.2em;font-weight:800;color:#efb96f}h1{font-size:clamp(36px,7vw,62px);line-height:1.05;letter-spacing:-.05em;margin:18px 0}
.lead,.muted{color:#bab2bf;line-height:1.6}
.panel{margin-top:35px;padding:clamp(20px,4vw,34px);background:#16151d;border:1px solid #ffffff24;border-radius:18px}
.barcode{display:block;width:100%;height:clamp(260px,36vw,330px);object-fit:fill;border-radius:10px;border:1px solid #efb96f50;background:#0b0b10;box-shadow:0 0 0 1px #ffffff0a,0 22px 70px #0008}
.timeline{display:flex;justify-content:space-between;font-size:10px;color:#9992a2;letter-spacing:.13em;margin-top:12px}
h2{margin:33px 0 15px;font-size:23px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice{border-radius:10px;border:1px solid #ffffff29;background:#22212c;color:#fff;text-align:left;padding:17px;cursor:pointer;font:650 14px inherit;font-family:inherit}
.choice:hover:not(:disabled){border-color:#edbd78;background:#302938}.choice.correct{border-color:#5bd1a8;background:#16372b}.choice.wrong{border-color:#ee8d94;background:#39232b}
.choice:disabled{cursor:default}.letter{font-size:11px;color:#efb96f;margin-right:12px}
.result{margin-top:26px;padding:22px;background:#29232b;border-radius:12px;text-align:center}.result[hidden]{display:none}
.poster{display:block;max-width:220px;max-height:320px;margin:20px auto;border-radius:8px}
footer{text-align:center;margin-top:28px;font-size:12px;color:#9992a2}footer a{text-underline-offset:3px}
@media(max-width:560px){main{margin:34px auto}.choices{grid-template-columns:1fr}.barcode{height:230px}}

/* Filmcode appearance: warm gallery light mode and original cinematic dark mode. */
:root{color-scheme:light;--page:#f5f1e9;--glow:#ece2d5;--ink:#24252a;--muted:#665e5a;--accent:#b65b42;--line:#cfc4b6;--panel:#ebe3d8;--choice:#fbf8f2;--choice-hover:#f2e5d7;--result:#e4d8cb;--timeline:#7a7068;--shadow:#40302722;--correct-bg:#d8ede0;--correct-line:#3b8464;--wrong-bg:#f4dadd;--wrong-line:#b6505e}
:root[data-theme="dark"]{color-scheme:dark;--page:#090a10;--glow:#25202c;--ink:#f6f2eb;--muted:#bab2bf;--accent:#efb96f;--line:#ffffff24;--panel:#16151d;--choice:#22212c;--choice-hover:#302938;--result:#29232b;--timeline:#9992a2;--shadow:#0008;--correct-bg:#16372b;--correct-line:#5bd1a8;--wrong-bg:#39232b;--wrong-line:#ee8d94}
html,body{background:var(--page);color:var(--ink)}
body{background:radial-gradient(ellipse at 50% 0%,var(--glow) 0%,var(--page) 65%)}
.top{display:flex;align-items:center;justify-content:space-between;gap:18px;border-color:var(--line)}
.top span,.accent,.overline,.letter{color:var(--accent)}
.lead,.muted{color:var(--muted)}
.panel{background:var(--panel);border-color:var(--line)}
.barcode{border-color:var(--line);box-shadow:0 0 0 1px var(--line),0 22px 60px var(--shadow)}
.timeline,footer{color:var(--timeline)}
.choice{border-color:var(--line);background:var(--choice);color:var(--ink)}
.choice:hover:not(:disabled){border-color:var(--accent);background:var(--choice-hover)}
.choice.correct{border-color:var(--correct-line);background:var(--correct-bg)}
.choice.wrong{border-color:var(--wrong-line);background:var(--wrong-bg)}
.result{background:var(--result)}
.theme-switch{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--choice);color:var(--ink);border-radius:999px;padding:10px 15px;font:750 12px/1 Inter,ui-sans-serif,system-ui,sans-serif;cursor:pointer;letter-spacing:.02em}
.theme-switch:hover{border-color:var(--accent);background:var(--choice-hover)}
.theme-switch:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.theme-icon{font-size:16px;line-height:1}
@media(max-width:560px){.theme-switch{padding:9px 11px}.top{gap:10px}}
</style>
<script src="analytics-config.js"></script><script src="telemetry.js"></script>
</head>
<body>
<header class="top"><a href="/" style="text-decoration:none">FILM<span>CODE</span></a><button id="theme-switch" class="theme-switch" type="button" aria-label="Switch to dark theme" aria-pressed="false"><span id="theme-icon" class="theme-icon" aria-hidden="true">☾</span><span id="theme-label">Dark mode</span></button></header>
<main>
<div class="overline" id="puzzle-number">ONE MOVIE · FILMCODE PILOT</div>
<h1>A movie. <span class="accent">Told in color.</span></h1>
<p class="lead">Every stripe follows the film's visual journey from beginning to end. Which movie does the palette belong to?</p>
<section class="panel">
<img id="barcode" class="barcode" alt="The movie's chronological color barcode" width="760" height="240">
<div class="timeline"><span>OPENING</span><span>THE FILM'S COLOR STORY</span><span>FINALE</span></div>
<div id="question-area"><h2>Which movie is this?</h2><div class="choices" id="choices"></div></div>
<div id="result" class="result" hidden aria-live="polite">
<div class="overline" id="outcome"></div><h2 id="movie-title"></h2><p id="movie-year"></p>
<img id="poster" class="poster" alt="Movie poster" loading="lazy">
<p class="muted" id="result-message"></p>
</div>
</section>
<footer><a href="/copyright.html">Copyright &amp; content reports</a></footer>
</main>
<script>
(function(){
  const toggle=document.getElementById('theme-switch');
  const label=document.getElementById('theme-label');
  const icon=document.getElementById('theme-icon');
  const meta=document.getElementById('theme-color');
  function sync(){
    const dark=document.documentElement.dataset.theme==='dark';
    label.textContent=dark?'Light mode':'Dark mode';
    icon.textContent=dark?'☀':'☾';
    toggle.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme');
    toggle.setAttribute('aria-pressed',dark?'true':'false');
    meta.setAttribute('content',dark?'#090a10':'#f5f1e9');
  }
  toggle.addEventListener('click',function(){
    const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
    document.documentElement.dataset.theme=next;
    try{localStorage.setItem('filmcode-theme',next)}catch{}
    sync();
  });
  sync();
})();
</script>
<script>
(async()=>{
  let key='filmcode-pilot-progress';
  const question=document.getElementById('question-area'),result=document.getElementById('result');
  function fail(message){question.textContent=message;document.getElementById('barcode').hidden=true;}
  let puzzle;
  try{
    const response=await fetch('puzzles.json',{cache:'no-store'});
    if(!response.ok)throw Error('Puzzle unavailable');
    const data=await response.json();
    if(data.mode!=='pilot')throw Error('Pilot challenge is being prepared. Come back soon!');
    puzzle=data.puzzles[0];
    if(!puzzle||!Array.isArray(puzzle.choices)||puzzle.choices.length!==4)throw Error('Challenge unavailable');
    key='filmcode-pilot-played-'+puzzle.id;
    document.getElementById('puzzle-number').textContent='FILMCODE PILOT · ONE MOVIE';
    document.getElementById('barcode').src='assets/'+encodeURIComponent(puzzle.id)+'-barcode.png';
  }catch(error){fail(error.message);return;}
  const revealLines = {
    correct: [
      ['Nailed it!', 'You spotted the film hiding in those colors. Nicely done.'],
      ['That\'s the one!', 'You\'ve got a good eye for a movie palette.'],
      ['You got it!', 'Turns out you really know your movie colors.'],
      ['Spot on!', 'You read that color story beautifully.'],
      ['Well played!', 'That was a sharp guess. Thanks for playing Filmcode.']
    ],
    incorrect: [
      ['Not quite!', 'A fair guess. This palette had a few tricks up its sleeve.'],
      ['Ah, tricky one!', 'These colors can be surprisingly hard to place.'],
      ['Good try!', 'This one was harder to read than it looked.'],
      ['Not this time.', 'The colors led you somewhere else. Happens to the best of us.'],
      ['That was sneaky!', 'Thanks for giving it a shot. There\'s more to a movie than its palette.']
    ]
  };
  function reveal(guess, lineIndex){
    const correct=guess===puzzle.answer;
    const lines=correct?revealLines.correct:revealLines.incorrect;
    const line=lines[Number.isInteger(lineIndex)&&lineIndex>=0&&lineIndex<lines.length
      ? lineIndex : Math.floor(Math.random()*lines.length)];
    question.hidden=true;result.hidden=false;
    document.getElementById('outcome').textContent=line[0];
    document.getElementById('movie-title').textContent=puzzle.title;
    document.getElementById('movie-year').textContent=String(puzzle.year);
    document.getElementById('poster').src='assets/'+encodeURIComponent(puzzle.id)+'-poster.jpg';
    document.getElementById('poster').alt='Poster for '+puzzle.title;
    document.getElementById('result-message').textContent=line[1];
  }
  try{
    const saved=JSON.parse(localStorage.getItem(key)||'null');
    if(saved&&saved.id===puzzle.id&&Number.isInteger(saved.guess)){reveal(saved.guess,saved.lineIndex);return}
  }catch{}
  const box=document.getElementById('choices');
  puzzle.choices.forEach((choice,i)=>{
    const button=document.createElement('button');button.className='choice';
    const letter=document.createElement('span');letter.className='letter';letter.textContent='ABCD'[i];
    button.append(letter,document.createTextNode(choice.title));box.append(button);
    button.addEventListener('click',()=>{
      window.filmcodeTrack?.('challenge_started',{mode:'pilot',puzzle:puzzle.id});
      window.filmcodeTrack?.('guess_submitted',{mode:'pilot',puzzle:puzzle.id,choice:i,correct:i===puzzle.answer});
      window.filmcodeTrack?.('challenge_completed',{mode:'pilot',puzzle:puzzle.id,correct:i===puzzle.answer});
      const lineIndex=Math.floor(Math.random()*revealLines[i===puzzle.answer?'correct':'incorrect'].length);
      try{localStorage.setItem(key,JSON.stringify({id:puzzle.id,guess:i,lineIndex}))}catch{}
      reveal(i,lineIndex);
    });
  });
})();
</script>
</body>
</html>
