<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:#090a10;color:#f6f2eb}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#25202c 0%,#090a10 65%);min-height:100vh}
a{color:inherit}.top{border-bottom:1px solid #ffffff18;padding:22px max(22px,calc((100vw - 920px)/2));font-weight:850;letter-spacing:.06em}
.top span,.accent{color:#efb96f}
main{max-width:920px;margin:48px auto 90px;padding:0 20px}
.overline{font-size:11px;letter-spacing:.2em;font-weight:800;color:#efb96f}h1{font-size:clamp(36px,7vw,62px);line-height:1.05;letter-spacing:-.05em;margin:18px 0}
.lead,.muted{color:#bab2bf;line-height:1.6}
.panel{margin-top:35px;padding:clamp(20px,4vw,34px);background:#16151d;border:1px solid #ffffff24;border-radius:18px}
.barcode{display:block;width:100%;height:clamp(260px,36vw,330px);object-fit:fill;border-radius:10px;border:1px solid #efb96f50;background:#0b0b10;box-shadow:0 0 0 1px #ffffff0a,0 22px 70px #0008}
.timeline{display:flex;justify-content:space-between;font-size:10px;color:#9992a2;letter-spacing:.13em;margin-top:12px}
h2{margin:33px 0 15px;font-size:23px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice{border-radius:10px;border:1px solid #ffffff29;background:#22212c;color:#fff;text-align:left;padding:17px;cursor:pointer;font:650 14px inherit;font-family:inherit}
.choice:hover:not(:disabled){border-color:#edbd78;background:#302938}.choice.correct{border-color:#5bd1a8;background:#16372b}.choice.wrong{border-color:#ee8d94;background:#39232b}
.choice:disabled{cursor:default}.letter{font-size:11px;color:#efb96f;margin-right:12px}
.result{margin-top:26px;padding:22px;background:#29232b;border-radius:12px;text-align:center}.result[hidden]{display:none}
.poster{display:block;max-width:220px;max-height:320px;margin:20px auto;border-radius:8px}
footer{text-align:center;margin-top:28px;font-size:12px;color:#9992a2}footer a{text-underline-offset:3px}
@media(max-width:560px){main{margin:34px auto}.choices{grid-template-columns:1fr}.barcode{height:230px}}

/* Filmcode appearance: warm gallery light mode and original cinematic dark mode. */
:root{color-scheme:light;--page:#f5f1e9;--glow:#ece2d5;--ink:#24252a;--muted:#665e5a;--accent:#b65b42;--line:#cfc4b6;--panel:#ebe3d8;--choice:#fbf8f2;--choice-hover:#f2e5d7;--result:#e4d8cb;--timeline:#7a7068;--shadow:#40302722;--correct-bg:#d8ede0;--correct-line:#3b8464;--wrong-bg:#f4dadd;--wrong-line:#b6505e}
:root[data-theme="dark"]{color-scheme:dark;--page:#081c21;--glow:#173940;--ink:#eaf4f1;--muted:#afc6c3;--accent:#ff9379;--line:#45676b;--panel:#102b31;--choice:#17373d;--choice-hover:#22464d;--result:#1b3940;--timeline:#97b3b0;--shadow:#0008;--correct-bg:#143c35;--correct-line:#67cbaa;--wrong-bg:#4c2d34;--wrong-line:#f19596}
html,body{background:var(--page);color:var(--ink)}
body{background:radial-gradient(ellipse at 50% 0%,var(--glow) 0%,var(--page) 65%)}
.top{display:flex;align-items:center;justify-content:space-between;gap:18px;border-color:var(--line)}
.top span,.accent,.overline,.letter{color:var(--accent)}
.lead,.muted{color:var(--muted)}
.panel{background:var(--panel);border-color:var(--line)}
.barcode{border-color:var(--line);box-shadow:0 0 0 1px var(--line),0 22px 60px var(--shadow)}
.timeline,footer{color:var(--timeline)}
.choice{border-color:var(--line);background:var(--choice);color:var(--ink)}
.choice:hover:not(:disabled){border-color:var(--accent);background:var(--choice-hover)}
.choice.correct{border-color:var(--correct-line);background:var(--correct-bg)}
.choice.wrong{border-color:var(--wrong-line);background:var(--wrong-bg)}
.result{background:var(--result)}
.theme-switch{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--choice);color:var(--ink);border-radius:999px;padding:10px 15px;font:750 12px/1 Inter,ui-sans-serif,system-ui,sans-serif;cursor:pointer;letter-spacing:.02em}
.theme-switch:hover{border-color:var(--accent);background:var(--choice-hover)}
.theme-switch:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.theme-icon{font-size:16px;line-height:1}
@media(max-width:560px){.theme-switch{padding:9px 11px}.top{gap:10px}}
.share-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:20px}.share-actions button{font:inherit;font-weight:700;border:1px solid var(--line,#777);border-radius:9px;padding:12px 18px;cursor:pointer;background:var(--choice,#22212c);color:var(--ink,#fff)}.share-actions button:hover,.share-actions button:focus-visible{outline:2px solid var(--accent,#efb96f);outline-offset:2px}#share-status{font-size:13px;min-height:1.4em}#share-fallback{width:100%;font:inherit;padding:10px}footer a{margin:0 7px}
.next-challenge{margin:22px auto 0;padding:18px 12px;border-top:1px solid var(--line);text-align:center}.next-challenge[hidden],.barcode[hidden]{display:none}.next-challenge .count-label{font-size:12px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}.next-challenge time{display:block;font-size:clamp(30px,7vw,46px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--ink);margin:8px 0}.next-challenge p{font-size:13px;margin:8px 0}.next-challenge button{margin:10px auto 0;padding:10px 18px;border:1px solid var(--line);border-radius:8px;background:var(--choice);color:var(--ink);font:inherit;cursor:pointer}.next-challenge button[hidden],.next-challenge time[hidden]{display:none}

/* Outcome feedback preserves the full barcode and all four choices. */
:root{--correct-ink:#246344;--wrong-ink:#963847}
:root[data-theme="dark"]{--correct-ink:#9ce9cc;--wrong-ink:#ffb0b5}
.choice{display:flex;align-items:center;gap:10px;transition:background .22s,border-color .22s,opacity .25s,transform .2s;font-size:15px;font-weight:650}
.choice .letter{margin-right:0;flex-shrink:0}.choice-title{flex:1;min-width:0;overflow-wrap:anywhere}.choice-mark{font-size:16px;font-weight:750;text-align:center;white-space:nowrap;flex-shrink:0;min-width:1em;line-height:1} .choice-mark:empty{display:none}
.choice.correct{color:var(--correct-ink);border:2px solid var(--correct-line);padding:16px}.choice.wrong{color:var(--wrong-ink);border:2px solid var(--wrong-line);padding:16px}
.choice.correct .letter,.choice.wrong .letter{color:inherit}.choice.dim{opacity:.65}
.choice.feedback-pop{animation:filmcode-pop .45s ease both}.choice.feedback-shake{animation:filmcode-shake .28s ease both}
.result{border:1px solid var(--outcome-line,var(--line));background:var(--result);padding:clamp(18px,4vw,30px)}
.result.is-correct{--outcome-line:var(--correct-line);--outcome-ink:var(--correct-ink);--outcome-bg:var(--correct-bg)}
.result.is-wrong{--outcome-line:var(--wrong-line);--outcome-ink:var(--wrong-ink);--outcome-bg:var(--wrong-bg)}
.outcome-symbol{width:60px;height:60px;display:grid;place-items:center;border:2px solid var(--outcome-line);border-radius:50%;background:var(--outcome-bg);color:var(--outcome-ink);font-size:34px;font-weight:700;margin:0 auto 12px}
.result #outcome{color:var(--outcome-ink);font-size:clamp(24px,5vw,32px);font-weight:850;letter-spacing:-.035em;margin:0 0 8px;line-height:1.15}
.result #movie-title{margin:18px 0 4px}.result #movie-year{margin:0;color:var(--muted)}.result .poster{max-width:min(220px,100%);height:auto}
.result.reveal-enter{animation:filmcode-enter .48s ease both}.result.reveal-enter .poster{animation:filmcode-enter .55s .13s ease both}.result.reveal-enter .share-actions{animation:filmcode-enter .4s .22s ease both}
@keyframes filmcode-pop{50%{transform:scale(1.025);box-shadow:0 0 16px var(--correct-bg)}}
@keyframes filmcode-shake{25%,75%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
@keyframes filmcode-enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.choice,.result,.result *{animation:none!important;transition:none!important}}

#result{scroll-margin-top:20px}#outcome:focus{outline:none}#outcome:focus-visible{outline:2px solid var(--outcome-line,var(--line));outline-offset:5px;border-radius:4px}

<body>
<header class="top"><a class="brand-home" href="/" aria-label="Filmcode home"><img class="brand-logo" src="/assets/filmcode-logo.png" width="330" height="64" alt="Filmcode"></a><button id="theme-switch" class="theme-switch" type="button" aria-label="Switch to dark theme" aria-pressed="false"><span id="theme-icon" class="theme-icon" aria-hidden="true">☾</span><span id="theme-label">Dark mode</span></button></header>

<script>
(function(){
  const toggle=document.getElementById('theme-switch');
  const label=document.getElementById('theme-label');
  const icon=document.getElementById('theme-icon');
  const meta=document.getElementById('theme-color');
  function sync(){
    const dark=document.documentElement.dataset.theme==='dark';
    label.textContent=dark?'Light mode':'Dark mode';
    icon.textContent=dark?'☀':'☾';
    toggle.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme');
    toggle.setAttribute('aria-pressed',dark?'true':'false');
    meta.setAttribute('content',dark?'#081c21':'#f5f1e9');
  }
  toggle.addEventListener('click',function(){
    const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
    document.documentElement.dataset.theme=next;
    try{localStorage.setItem('filmcode-theme',next)}catch{}
    sync();
  });
  sync();
})();
</script>
<script>
(async()=>{
  let key;
  const question=document.getElementById('question-area'),result=document.getElementById('result');
  function fail(message){question.textContent=message;document.getElementById('barcode').hidden=true;}
  let puzzle,challengeDate;
  const countdown=document.getElementById('next-challenge');
  const clock=document.getElementById('next-countdown');
  const countLabel=document.getElementById('count-label');
  const note=document.getElementById('next-note');
  const checkButton=document.getElementById('next-check');
  let checking=false,interval=null,lastCheck=0,nextAt=0,expired=false;
  async function checkNext(){
    if(checking)return;
    checking=true;lastCheck=Date.now();checkButton.disabled=true;
    try{
      const response=await fetch('puzzles.json',{cache:'no-store'});
      if(!response.ok)throw Error('Unavailable');
      const data=await response.json();
      if(data.mode==='daily'&&data.daily_date===new Date().toISOString().slice(0,10)&&data.daily_date!==challengeDate&&data.puzzles?.[0]?.choices?.length===4){
        if(interval!==null)clearInterval(interval);
        location.reload();
        return;
      }
      note.textContent='The next challenge is being prepared. We will check again shortly.';
    }catch{note.textContent='Unable to check for a new challenge. We will retry shortly.';}
    finally{checking=false;checkButton.disabled=false;}
  }
  function tick(){
    const seconds=Math.max(0,Math.ceil((nextAt-Date.now())/1000));
    if(seconds>0){
      clock.textContent=[Math.floor(seconds/3600),Math.floor(seconds%3600/60),seconds%60].map(n=>String(n).padStart(2,'0')).join(':');
      return;
    }
    if(!expired){
      expired=true;clock.hidden=true;countLabel.textContent='Waiting for the next challenge';
      note.hidden=false;note.textContent='Checking for the new movie…';checkButton.hidden=false;
    }
    if(Date.now()-lastCheck>=30000)checkNext();
  }
  function startCountdown(date){
    if(interval!==null)return;
    nextAt=Date.parse(date+'T00:00:00Z')+86400000;
    if(!Number.isFinite(nextAt))return;
    countdown.hidden=false;tick();interval=setInterval(tick,1000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
    checkButton.addEventListener('click',checkNext);
  }
  try{
    const response=await fetch('puzzles.json',{cache:'no-store'});
    if(!response.ok)throw Error('Puzzle unavailable');
    const data=await response.json();
    if(data.mode!=='daily')throw Error('Daily challenge unavailable.');
    challengeDate=data.daily_date;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(challengeDate||''))throw Error('Challenge date unavailable.');
    const today=new Date().toISOString().slice(0,10);
    if(challengeDate>today){
      fail('The next challenge is not available yet.');
      return;
    }
    // Keep the previous approved challenge available during a delayed release.
    // Label it explicitly and check periodically for the new published challenge.
    const previousChallenge=challengeDate<today;
    if(previousChallenge)startCountdown(challengeDate);
    key='filmcode-played-'+challengeDate;
    puzzle=data.puzzles[0];
    if(!puzzle||!Array.isArray(puzzle.choices)||puzzle.choices.length!==4)throw Error('Challenge unavailable');
    document.getElementById('puzzle-number').textContent=(previousChallenge?'PREVIOUS CHALLENGE #':'DAILY CHALLENGE #')+String(data.puzzle_number).padStart(3,'0');
    document.getElementById('barcode').src='assets/'+encodeURIComponent(puzzle.id)+'-barcode.png';
  }catch(error){fail(error.message);return;}
  const revealLines = {
  "correct": [
    [
      "Nailed it!",
      "You spotted the film hiding in those colors."
    ],
    [
      "That's the one!",
      "You've got a good eye for a movie palette."
    ],
    [
      "You got it!",
      "The colors told you everything you needed to know."
    ],
    [
      "Spot on!",
      "You read that color story beautifully."
    ],
    [
      "Well played!",
      "A sharp eye for cinema makes all the difference."
    ],
    [
      "Picture perfect!",
      "No dialogue, no faces. Just colors, and you got it."
    ],
    [
      "That's a wrap!",
      "Another movie decoded. See you at the next challenge."
    ],
    [
      "Beautifully decoded!",
      "You recognized the visual signature of the film."
    ]
  ],
  "incorrect": [
    [
      "Not quite!",
      "A fair guess. This palette had a few tricks up its sleeve."
    ],
    [
      "Ah, tricky one!",
      "Some films are surprisingly hard to recognize by color alone."
    ],
    [
      "Good try!",
      "This one was harder to read than it looked."
    ],
    [
      "Not this time.",
      "The colors led you to a different film."
    ],
    [
      "That was sneaky!",
      "There's more to a movie than its palette."
    ],
    [
      "Plot twist!",
      "The real answer was hiding in plain sight."
    ],
    [
      "A different ending!",
      "Every movie has its own color story. On to the next one."
    ],
    [
      "The big reveal!",
      "This palette belonged to a different movie. Thanks for playing."
    ]
  ]
};
  function pickCopy(guess){
    const lines=revealLines[guess===puzzle.answer?'correct':'incorrect'];
    return {headlineIndex:Math.floor(Math.random()*lines.length),messageIndex:Math.floor(Math.random()*lines.length),shareIndex:Math.floor(Math.random()*3)};
  }
  function validIndex(index,length){return Number.isInteger(index)&&index>=0&&index<length?index:0;}
  function reveal(guess, wording, animate=false){
    const correct=guess===puzzle.answer;
    const lines=correct?revealLines.correct:revealLines.incorrect;
    const headline=lines[validIndex(wording?.headlineIndex,lines.length)][0];
    const message=lines[validIndex(wording?.messageIndex,lines.length)][1];
    result.classList.add(correct?'is-correct':'is-wrong');
    if(animate&&!reduceMotion())result.classList.add('reveal-enter');
    document.getElementById('outcome-symbol').textContent=correct?'✓':'×';
    result.hidden=false;
    startCountdown(challengeDate);
    document.getElementById('outcome').textContent=headline;
    document.getElementById('movie-title').textContent=puzzle.title;
    const directors=Array.isArray(puzzle.directors)?puzzle.directors.filter(x=>typeof x==='string'&&x.trim()).map(x=>x.trim()):[];
    document.getElementById('movie-year').textContent=String(puzzle.year)+(directors.length?' · Directed by '+directors.join(' & '):'');
    document.getElementById('poster').src='assets/'+encodeURIComponent(puzzle.id)+'-poster.jpg';
    document.getElementById('poster').alt='Poster for '+puzzle.title;
    document.getElementById('result-message').textContent=message;
    // Only scroll for a newly submitted guess, after the result has been laid out.
    if(animate)requestAnimationFrame(()=>{
      document.getElementById('outcome').focus({preventScroll:true});
      if(reduceMotion()){
        result.scrollIntoView({behavior:'instant',block:'start',inline:'nearest'});
        return;
      }
      const start=window.scrollY;
      const target=()=>Math.max(0,Math.min(window.scrollY+result.getBoundingClientRect().top-20,document.documentElement.scrollHeight-window.innerHeight));
      // Browser-native smooth scrolling has no configurable duration.
      const duration=1300;
      let started=null,frame=0,cancelled=false;
      const events=['wheel','touchstart','pointerdown','keydown'];
      function cleanup(){events.forEach(type=>window.removeEventListener(type,cancel));document.removeEventListener('visibilitychange',cancel);}
      function cancel(){cancelled=true;cancelAnimationFrame(frame);cleanup();}
      events.forEach(type=>window.addEventListener(type,cancel,{passive:true}));
      document.addEventListener('visibilitychange',cancel);
      function step(now){
        if(cancelled)return;
        if(started===null)started=now;
        const progress=Math.min(1,(now-started)/duration);
        const eased=progress<.5?2*progress*progress:1-Math.pow(-2*progress+2,2)/2;
        window.scrollTo({top:start+(target()-start)*eased,behavior:'instant'});
        if(progress<1)frame=requestAnimationFrame(step);else cleanup();
      }
      frame=requestAnimationFrame(step);
    });
    const shareLines=correct?['I guessed the movie from its colors!','Movie decoded!','I got today\'s color challenge right!']:['Filmcode got me this time!','This movie palette fooled me!','I didn\'t crack this color code.'];
    const shareText=shareLines[validIndex(wording?.shareIndex,shareLines.length)]+' Can you decode the movie?';
    const url='https://playfilmcode.com/?utm_source=player_share&utm_medium=organic';
    const text=shareText+'\n'+url;
    const status=document.getElementById('share-status');
    const fallback=document.getElementById('share-fallback');
    const record=()=>{try{window.filmcodeTrack?.('result_shared',{mode:'daily',puzzle:puzzle.edition_id||puzzle.id,correct})}catch{}};
    const copy=async()=>{
      try{await navigator.clipboard.writeText(text);status.textContent='Copied!';fallback.hidden=true;record();}
      catch{fallback.hidden=false;fallback.value=text;fallback.focus();fallback.select();status.textContent='Select and copy this message.';}
    };
    document.getElementById('copy-result').onclick=copy;
    document.getElementById('share-result').onclick=async()=>{
      if(!navigator.share){await copy();return;}
      try{await navigator.share({title:'Filmcode',text:shareText,url});status.textContent='Shared!';record();}
      catch(error){if(error.name!=='AbortError')await copy();}
    };
  }
  const box=document.getElementById('choices');
  let answered=false;
  const reduceMotion=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  puzzle.choices.forEach((choice,i)=>{
    const button=document.createElement('button');button.className='choice';
    const letter=document.createElement('span');letter.className='letter';letter.textContent='ABCD'[i];
    const title=document.createElement('span');title.className='choice-title';title.textContent=choice.title;
    const mark=document.createElement('span');mark.className='choice-mark';
    button.append(letter,title,mark);box.append(button);
    button.addEventListener('click',()=>{
      if(answered)return;
      // Keep the last published challenge playable until the new one arrives.
      answered=true;
      window.filmcodeTrack?.('challenge_started',{mode:'daily',puzzle:puzzle.edition_id||puzzle.id});
      window.filmcodeTrack?.('guess_submitted',{mode:'daily',puzzle:puzzle.edition_id||puzzle.id,choice:i,correct:i===puzzle.answer});
      window.filmcodeTrack?.('challenge_completed',{mode:'daily',puzzle:puzzle.edition_id||puzzle.id,correct:i===puzzle.answer});
      const wording=pickCopy(i);
      try{localStorage.setItem(key,JSON.stringify({id:puzzle.id,guess:i,wording}))}catch{}
      feedback(i,true,()=>reveal(i,wording,true));
    });
  });
  function feedback(guess,animate,done){
    answered=true;
    const buttons=Array.from(box.children);
    const win=guess===puzzle.answer;
    const motion=animate&&!reduceMotion();
    buttons.forEach((b,j)=>{b.disabled=true;if(j!==guess&&j!==puzzle.answer)b.classList.add('dim');});
    function mark(index,cls,label,animation){
      const b=buttons[index];if(!b)return;
      b.classList.add(cls);const mark=b.querySelector('.choice-mark');mark.textContent=cls==='correct'?'✓':'×';mark.setAttribute('aria-label',label);mark.title=label;
      if(motion&&animation)b.classList.add(animation);
    }
    mark(guess,win?'correct':'wrong',win?'Your guess — correct':'Your guess — incorrect',win?'feedback-pop':'feedback-shake');
    const correct=()=>{if(!win)mark(puzzle.answer,'correct','Correct answer','feedback-pop');};
    if(motion&&!win)setTimeout(correct,280);else correct();
    if(motion)setTimeout(done,620);else done();
  }
  try{
    const saved=JSON.parse(localStorage.getItem(key)||'null');
    if(saved&&saved.id===puzzle.id&&Number.isInteger(saved.guess)&&saved.guess>=0&&saved.guess<4){
      // Preserve wording from earlier versions of the game.
      const old=validIndex(saved.lineIndex,revealLines[saved.guess===puzzle.answer?'correct':'incorrect'].length);
      const wording=saved.wording??{headlineIndex:old,messageIndex:old,shareIndex:old%3};
      feedback(saved.guess,false,()=>reveal(saved.guess,wording,false));
    }
  }catch{}
})();
</script>
