name: MKIA — curate and publish daily movie
on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
concurrency:
  group: chroma-pages
  cancel-in-progress: false
jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install pillow
      - name: MKIA discovers eligible open movies
        id: discovery
        continue-on-error: true
        run: python scripts/discover.py
      - name: MKIA selects and generates next film
        id: generation
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/mkia.py
      - name: Check puzzle queue
        id: health
        run: python scripts/health.py
      - name: Build MKIA Control Room data
        run: python scripts/build_control_data.py
      - name: Commit generated puzzle assets
        run: |
          git config user.name "chroma-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/puzzles.json dist/assets dist/control-room/data.json dist/control-room/reviews catalog.json choice_pool.json discovery_review.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate next daily movie barcode"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
      - name: Alert on failed generation or low puzzle supply
        if: always() && steps.health.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DISCOVERY_FAILED: ${{ steps.discovery.outcome == 'failure' }}
          GENERATION_FAILED: ${{ steps.generation.outcome == 'failure' }}
          LOW_QUEUE: ${{ steps.health.outputs.low }}
          REMAINING: ${{ steps.health.outputs.remaining }}
          AVAILABLE: ${{ steps.health.outputs.available }}
        run: |
          title='MKIA needs attention'
          existing=$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "MKIA needs attention") | .number' | head -1)
          if [[ "$DISCOVERY_FAILED" == true || "$GENERATION_FAILED" == true || "$LOW_QUEUE" == true ]]; then
            body="MKIA health check: **${REMAINING}** playable days remain; **${AVAILABLE}** approved unused sources. Discovery failed: **${DISCOVERY_FAILED}**. Generation failed: **${GENERATION_FAILED}**. [Inspect this workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            if [[ -z "$existing" ]]; then
              gh issue create --title "$title" --body "$body"
            else
              gh issue comment "$existing" --body "$body"
            fi
          elif [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body 'MKIA health recovered; the queue is above the warning threshold.'
            gh issue close "$existing" --reason completed
          fi
