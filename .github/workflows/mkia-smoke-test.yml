name: MKIA barcode pipeline smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/mkia.py'
      - 'scripts/stills_barcode.py'
      - 'scripts/shot_selector.py'
      - 'scripts/mkia_smoke_test.py'
      - '.github/workflows/mkia-smoke-test.yml'
permissions:
  contents: read
jobs:
  synthetic-full-film-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic video test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install 'Pillow>=10,<13'
      - name: Validate chronological barcode, trimming and reveal selection
        run: python scripts/mkia_smoke_test.py
